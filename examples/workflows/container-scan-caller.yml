name: Container security scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: example/security-workflows/.github/workflows/container-scan.yml@REPLACE_WITH_FULL_COMMIT_SHA
    with:
      image-name: example-product
      image-tag: scan
      SCANNER_TRIVY_VERSION: "REPLACE_WITH_TRIVY_VERSION"
      SCANNER_GRYPE_VERSION: "REPLACE_WITH_GRYPE_VERSION"
      upload-sarif: true

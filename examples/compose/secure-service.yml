services:
  app:
    image: ghcr.io/example/product@sha256:REPLACE_WITH_IMAGE_DIGEST
    read_only: true
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      APP_ENV: production
    secrets:
      - database_url
    healthcheck:
      test: ["CMD", "/app/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      # These limits apply to Swarm; mem_limit and cpus above cover plain Compose.
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - edge
      - data

secrets:
  database_url:
    file: ./secrets/REPLACE_WITH_DATABASE_URL_FILE

networks:
  edge:
    external: true
    name: REPLACE_WITH_EDGE_NETWORK
  data:
    internal: true
